<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>آزمایشگاه ماشین — طراحی، اسمبل و شبیه‌سازی</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --bg: #f3f4fb;
        --c: #fff;
        --t: #191b2c;
        --m: #6a6f8a;
        --a: #6d5efc;
        --a2: #12b5a0;
        --b: #e2e4f2;
        --e: #e5484d;
        --k: #f6f7fd;
        --sh: 0 8px 30px #6d5efc18;
        --f0: #ece9ff;
        --f1: #d9f6ef;
        --f2: #ffe9d6;
        --f3: #e1efff;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d0e19;
          --c: #171929;
          --t: #e9ebf8;
          --m: #8f94b5;
          --b: #2b2e49;
          --k: #101120;
          --sh: 0 8px 30px #0008;
          --f0: #2a2560;
          --f1: #124038;
          --f2: #4a3020;
          --f3: #1d3556;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d0e19;
        --c: #171929;
        --t: #e9ebf8;
        --m: #8f94b5;
        --b: #2b2e49;
        --k: #101120;
        --sh: 0 8px 30px #0008;
        --f0: #2a2560;
        --f1: #124038;
        --f2: #4a3020;
        --f3: #1d3556;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background:
          radial-gradient(1200px 500px at 90% -10%, #6d5efc22, transparent),
          radial-gradient(900px 400px at 0% 0%, #12b5a022, transparent),
          var(--bg);
        color: var(--t);
        font:
          14px/1.7 Vazirmatn,
          Tahoma,
          sans-serif;
        min-height: 100vh;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        padding: 10px 18px;
        background: color-mix(in srgb, var(--c) 85%, transparent);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--b);
      }
      .logo {
        font-weight: 800;
        font-size: 17px;
        background: linear-gradient(90deg, var(--a), var(--a2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-inline-end: 8px;
      }
      nav {
        display: flex;
        gap: 4px;
        margin-inline-start: auto;
      }
      .tab {
        border: 0;
        background: transparent;
        color: var(--m);
        padding: 7px 14px;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .tab.on {
        background: linear-gradient(135deg, var(--a), #8f7bff);
        color: #fff;
        box-shadow: 0 4px 14px #6d5efc55;
      }
      main {
        max-width: 1250px;
        margin: 18px auto;
        padding: 0 16px;
        display: grid;
        gap: 16px;
      }
      .card {
        background: var(--c);
        border: 1px solid var(--b);
        border-radius: 18px;
        padding: 16px 18px;
        box-shadow: var(--sh);
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 16px;
      }
      @media (max-width: 900px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
      }
      label {
        display: grid;
        gap: 3px;
        font-size: 12px;
        color: var(--m);
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
      }
      input,
      select,
      textarea {
        background: var(--k);
        color: var(--t);
        border: 1px solid var(--b);
        border-radius: 10px;
        padding: 6px 10px;
        min-width: 0;
        width: 100%;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--a);
        border-color: transparent;
      }
      .mono,
      textarea,
      .it input,
      .fr input {
        font-family: "JetBrains Mono", Consolas, monospace;
        direction: ltr;
        text-align: left;
      }
      .bt,
      .ic {
        border: 1px solid var(--b);
        background: var(--k);
        color: var(--t);
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        font-weight: 600;
      }
      .bt:hover,
      .ic:hover {
        border-color: var(--a);
      }
      .bt.pr {
        background: linear-gradient(135deg, var(--a), #8f7bff);
        color: #fff;
        border: 0;
      }
      .ic {
        padding: 4px 9px;
        color: var(--e);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .chip {
        background: var(--k);
        border: 1px solid var(--b);
        border-radius: 999px;
        padding: 2px 12px;
        font-size: 12px;
      }
      .chip b {
        font-family: "JetBrains Mono", monospace;
        color: var(--a);
      }
      .hd {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      .title {
        font-weight: 800;
        font-size: 15px;
        max-width: 260px;
      }
      .dg {
        display: flex;
        direction: ltr;
        gap: 0;
        margin: 8px 0 14px;
        overflow-x: auto;
      }
      .fb {
        min-width: 64px;
        text-align: center;
        border: 2px solid var(--a);
        padding: 6px 4px;
        margin-inline-end: -2px;
        display: grid;
      }
      .fb b {
        font-size: 13px;
      }
      .fb i {
        font-size: 11px;
        color: var(--m);
        font-style: normal;
        border-top: 1px dashed var(--b);
        margin-top: 3px;
      }
      .t-opcode {
        background: var(--f0);
      }
      .t-reg {
        background: var(--f1);
      }
      .t-addr {
        background: var(--f2);
      }
      .t-imm {
        background: var(--f3);
      }
      .fr {
        display: grid;
        grid-template-columns: 1fr 80px 100px 34px;
        gap: 6px;
        margin-bottom: 6px;
        max-width: 460px;
      }
      .it {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0;
      }
      .it th {
        font-size: 12px;
        color: var(--m);
        text-align: start;
        padding: 2px 4px;
      }
      .it td {
        padding: 3px 4px;
      }
      .er {
        color: var(--e);
        font-size: 12px;
      }
      .res {
        overflow-x: auto;
      }
      .rt {
        width: 100%;
        border-collapse: collapse;
        direction: ltr;
      }
      .rt td,
      .rt th {
        padding: 4px 10px;
        border-bottom: 1px solid var(--b);
        text-align: left;
        vertical-align: top;
        font-family: "JetBrains Mono", monospace;
        font-size: 12.5px;
      }
      .rt th {
        color: var(--m);
        font-family: Vazirmatn;
        font-weight: 600;
      }
      .ad {
        color: var(--a);
        font-weight: 600;
      }
      .mc {
        color: var(--a2);
        font-weight: 600;
      }
      .src {
        color: var(--t);
        white-space: pre;
      }
      .rt tr.bad td {
        background: #e5484d14;
      }
      .fl {
        display: flex;
        gap: 3px;
        margin-top: 3px;
        flex-wrap: wrap;
      }
      .fl span {
        font-size: 10.5px;
        padding: 0 6px;
        border-radius: 6px;
        color: var(--t);
      }
      textarea {
        height: 430px;
        resize: vertical;
        line-height: 1.6;
        font-size: 13px;
      }
      .hint {
        color: var(--m);
        font-size: 12px;
        margin: 6px 0 0;
      }
      details {
        margin-top: 6px;
        color: var(--m);
      }
      details code {
        color: var(--a);
        direction: ltr;
        unicode-bidi: embed;
      }
      .sw {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .reg {
        background: var(--k);
        border: 1px solid var(--b);
        border-radius: 10px;
        padding: 2px 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        direction: ltr;
      }
      .reg i {
        color: var(--m);
        font-style: normal;
      }
      .reg.pc {
        border-color: var(--a);
      }
      .mem td {
        text-align: center;
        padding: 2px 6px;
      }
      .mem td.cur {
        background: var(--f0);
        font-weight: 700;
      }
      .mem td.chg {
        color: var(--a2);
        font-weight: 700;
      }
      .log {
        max-height: 200px;
        overflow: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        direction: ltr;
        text-align: left;
        color: var(--m);
      }
      .warn {
        color: var(--e);
      }
      #ov {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #0b0c18ee;
        overflow: auto;
        padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px;
        display: grid;
        gap: 16px;
        justify-items: center;
        align-content: start;
        direction: ltr;
      }
      #ov canvas {
        width: min(100%, 1100px);
        height: auto;
        border-radius: 14px;
        cursor: pointer;
      }
      .ob {
        position: sticky;
        top: 0;
        display: flex;
        gap: 10px;
        align-items: center;
        color: #fff;
        z-index: 2;
      }
      /* ===== graphic simulation (v1.2) ===== */
      .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
      .pill{border:1px solid var(--b);background:var(--c);color:var(--m);padding:7px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
      .pill:hover{border-color:var(--a)}
      .pill.on{background:var(--t);color:var(--bg);border-color:var(--t)}
      .gx .sw{align-items:center}
      .spd{display:flex;flex-direction:row;align-items:center;gap:6px;margin-inline-start:auto}
      .spd input{width:110px;padding:0}
      .gscroll{overflow-x:auto;direction:ltr;border-radius:16px;border:1px solid var(--b);background:
        radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--m) 22%,transparent) 1px,transparent 1.5px) 0 0/22px 22px,var(--k)}
      #stg,#lst{display:block;min-width:940px;width:100%;height:auto;font-family:Vazirmatn,Tahoma,sans-serif}
      #stg text,#lst text{direction:ltr}
      #stg .fa,#lst .fa{direction:rtl}
      .cpu{fill:color-mix(in srgb,var(--a) 5%,var(--c));stroke:var(--a);stroke-width:2.5}
      .grp{fill:color-mix(in srgb,var(--c) 70%,transparent);stroke:var(--b);stroke-width:2;stroke-dasharray:7 5}
      .gt{font:700 12.5px Vazirmatn,Tahoma,sans-serif;fill:var(--m)}
      .gs{font:11px Vazirmatn,Tahoma,sans-serif;fill:var(--m)}
      .bx rect{fill:var(--c);stroke:var(--b);stroke-width:1.6;transition:fill .35s,stroke .35s}
      .bx .bl{font:10.5px Vazirmatn,Tahoma,sans-serif;fill:var(--m)}
      .bx .bv{font:600 14px "JetBrains Mono",Consolas,monospace;fill:var(--t);text-anchor:middle}
      .bx.fl rect{fill:color-mix(in srgb,var(--a2) 32%,var(--c));stroke:var(--a2);stroke-width:2.6}
      .bx.hot rect{stroke:var(--a);stroke-width:2.4}
      #ctl rect{fill:color-mix(in srgb,var(--a) 7%,var(--c))}
      #cmn{font:700 12.5px "JetBrains Mono",monospace;fill:var(--a);text-anchor:end}
      #cop{font:11px "JetBrains Mono",monospace;fill:var(--t)}
      #cin{font:10px Vazirmatn,Tahoma,sans-serif;fill:var(--m);direction:rtl}
      #cfd rect{stroke:var(--a);stroke-width:1.6}
      #cfd .f-opcode,.f-opcode{fill:var(--f0)} #cfd .f-reg,.f-reg{fill:var(--f1)} #cfd .f-addr,.f-addr{fill:var(--f2)} #cfd .f-imm,.f-imm{fill:var(--f3)}
      #cfd .fn{font:600 10px Vazirmatn,sans-serif;fill:var(--t);text-anchor:middle}
      #cfd .fv{font:600 11px "JetBrains Mono",monospace;fill:var(--a);text-anchor:middle}
      #cfd g.hot rect{stroke-width:3.2;stroke:var(--e)}
      #alf{fill:color-mix(in srgb,var(--a2) 10%,var(--c));stroke:var(--a2);stroke-width:2;transition:fill .3s}
      #alf.fl{fill:color-mix(in srgb,var(--a2) 40%,var(--c))}
      #aop{font:700 22px "JetBrains Mono",monospace;fill:var(--a2);text-anchor:middle}
      .dec{fill:color-mix(in srgb,var(--a) 8%,var(--c));stroke:var(--a);stroke-width:2}
      .dt{font:700 11px "JetBrains Mono",monospace;fill:var(--a);text-anchor:middle}
      .memf{fill:var(--c);stroke:var(--a2);stroke-width:2.5}
      .mr rect.mrr{fill:var(--k);stroke:var(--b);stroke-width:1;transition:fill .3s}
      .mr .ma{font:11.5px "JetBrains Mono",monospace;fill:var(--m)}
      .mr .mv{font:600 13px "JetBrains Mono",monospace;fill:var(--t);text-anchor:middle}
      .mr .mn{font:10px "JetBrains Mono",monospace;fill:var(--a)}
      .mr.chg .mv{fill:var(--a2)}
      .mr.sel rect.mrr{fill:color-mix(in srgb,var(--a2) 30%,var(--c));stroke:var(--a2);stroke-width:2}
      .mr.sel.wm rect.mrr{fill:color-mix(in srgb,var(--e) 24%,var(--c));stroke:var(--e)}
      .swap{animation:swp .5s ease}
      @keyframes swp{from{opacity:.15;transform:translateY(10px)}to{opacity:1;transform:none}}
      .dl,.rs{stroke:var(--b);stroke-width:1.6}
      .dl.on{stroke:var(--a);stroke-width:3.4}
      .rs.on{stroke:var(--a2);stroke-width:3.4}
      .lamp rect{fill:var(--k);stroke:var(--b);stroke-width:1.5;transition:fill .2s}
      .lamp text{font:700 10.5px Vazirmatn,sans-serif;fill:var(--m);text-anchor:middle}
      .lamp.on.lr rect{fill:var(--a2);stroke:var(--a2)}
      .lamp.on.lw rect{fill:var(--e);stroke:var(--e)}
      .lamp.on text{fill:#fff}
      .wr .wl{fill:none;stroke:color-mix(in srgb,var(--m) 55%,transparent);stroke-width:2.4;stroke-linejoin:round}
      .wr polygon{fill:color-mix(in srgb,var(--m) 65%,transparent)}
      .wr .wf{fill:none;stroke:var(--wc);stroke-width:4;stroke-dasharray:8 10;opacity:0;stroke-linejoin:round}
      .wr.on .wl{stroke:var(--wc);stroke-width:3.2}
      .wr.on polygon{fill:var(--wc)}
      .wr.on .wf{opacity:.55;animation:dsh .7s linear infinite}
      @keyframes dsh{to{stroke-dashoffset:-36}}
      .bd circle{fill:var(--bc);stroke:var(--c);stroke-width:2.5}
      .bd text{font:700 12px "JetBrains Mono",monospace;fill:#fff;text-anchor:middle}
      .bd{transition:opacity .3s;opacity:.55}
      .bd.on{opacity:1}
      .bd.on circle{animation:pop .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pop{50%{transform:scale(1.3)}}
      .pk rect{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 3px 5px #0006)}
      .pk text{font:700 11.5px "JetBrains Mono",monospace;fill:#fff;text-anchor:middle}
      .iot{fill:color-mix(in srgb,var(--a) 6%,var(--c));stroke:var(--a);stroke-width:2.2}
      .iol{font:700 14px Vazirmatn,sans-serif;fill:var(--t);text-anchor:middle}
      .gx2{margin-top:16px}
      #nt{margin:0 0 6px;font-size:15px}
      #nb{min-height:96px;line-height:1.9}
      #nb code,.plg code{font-family:"JetBrains Mono",monospace;direction:ltr;unicode-bidi:embed;color:var(--a);background:var(--k);padding:0 6px;border-radius:6px}
      .pls{display:grid;gap:8px}
      .pl{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 10px;border:1px solid var(--b);border-radius:14px;background:var(--k);transition:border-color .3s,box-shadow .3s,background .3s}
      .pl .pn{width:30px;height:30px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font:700 14px "JetBrains Mono",monospace}
      .pl p{margin:2px 0 6px;color:var(--m);font-size:12.5px;line-height:1.75}
      .pl small{color:var(--m);font-family:"JetBrains Mono",monospace;direction:ltr;unicode-bidi:embed}
      .pl .bt{padding:2px 10px;font-size:12px}
      .pl.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--k));box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 35%,transparent)}
      .lgbox{max-height:230px;overflow:auto;font-size:12.5px;color:var(--m)}
      .lgbox div{padding:2px 0;border-bottom:1px dashed var(--b)}
      .lgbox b{color:var(--t)}
      .labc{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
      .labc label{width:130px}
      .notat{font-family:"JetBrains Mono",monospace;direction:ltr;text-align:left;background:var(--k);border:1px solid var(--b);border-radius:12px;padding:8px 14px;margin:12px 0 0;color:var(--a);font-weight:600;min-height:40px}
      #lst .lrow{cursor:pointer}
      @media (prefers-reduced-motion:reduce){.wr.on .wf,.bd.on circle,.swap{animation:none}}
    </style>
  </head>
  <body>
    <header>
      <span class="logo">⚙️ آزمایشگاه ماشین</span
      ><select id="sel" style="width: auto; min-width: 170px"></select>
      <button class="bt" data-act="newm">+ ماشین جدید</button
      ><button class="bt" data-act="dup">کپی</button
      ><button class="bt" data-act="del">حذف</button
      ><button class="bt" data-act="theme">🌓</button
      ><button class="bt" data-act="lang">EN</button
      ><button class="bt" data-act="exp">⬇ Export</button
      ><button class="bt" data-act="imp">⬆ Import</button
      ><button class="bt pr" data-act="sl">🖼 Slides</button
      ><input type="file" id="fi" accept=".json" hidden /><span
        class="chip"
        id="db"
        hidden
        >SQLite ✓</span
      >
      <nav>
        <button class="tab" data-tab="def">۱ · تعریف ماشین</button
        ><button class="tab" data-tab="asm">۲ · برنامه و کامپایل</button
        ><button class="tab" data-tab="sim">۳ · شبیه‌ساز</button>
      </nav>
    </header>
    <main id="main"></main>
    <script>
      const $ = (s) => document.querySelector(s),
        E = (s) =>
          String(s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      const H = (n, d = 0) =>
          Number(n).toString(16).toUpperCase().padStart(d, "0"),
        mod = (x, n) => ((x % n) + n) % n,
        sg = (x, w) => {
          x = mod(x, 2 ** w);
          return x >= 2 ** (w - 1) ? x - 2 ** w : x;
        };
      const uid = () => Math.random().toString(36).slice(2, 9);
      /* ---------- presets ---------- */
      const F = (n, f, i) => ({
        n,
        f: f.map((x) => ({ n: x[0], b: x[1], t: x[2] })),
        i: i.map((x) => ({ o: x[0], s: x[1], op: x[2] })),
      });
      const mk = (name, u, a, w, rc, rb, fm, code) => ({
        id: uid(),
        name,
        u,
        a,
        w,
        en: "big",
        rc,
        rb,
        rp: "R",
        sp: "",
        fm,
        code,
      });
      const M3 = mk(
        "Example Machine 3",
        8,
        16,
        16,
        0,
        16,
        [
          F(
            "Format I",
            [
              ["Opcode", 8, "opcode"],
              ["addr1", 16, "addr"],
              ["addr2", 16, "addr"],
            ],
            [
              ["00000000", "mov addr1,addr2", "M[addr1] <- M[addr2]"],
              ["00000001", "mov addr1,(addr2)", "M[addr1] <- M[M[addr2]]"],
              ["00000010", "mov (addr1),addr2", "M[M[addr1]] <- M[addr2]"],
              [
                "00000011",
                "add addr1,addr2",
                "M[addr1] <- M[addr1] + M[addr2]",
              ],
              [
                "00000100",
                "sub addr1,addr2",
                "M[addr1] <- M[addr1] - M[addr2]",
              ],
              [
                "00000101",
                "add addr1,(addr2)",
                "M[addr1] <- M[addr1] + M[M[addr2]]",
              ],

            return { t: "m", a };

          if (t === "R" && pk() === "[") {
            nx();
            const a = expr();
            ex("]");
            return { t: "r", a };
          }
          if (t === "sext") {
            ex("(");
            const a = expr();
            ex(",");

        const wait = async (ms) => {
          chk();

          chk();

        const fly = (pts, label, col, ms = 650) => {
          const layer = document.getElementById("pkl");
          if (!layer || !pts || pts.length < 2) return Promise.resolve();
          const seg = [];
          let tot = 0;
          for (let i = 1; i < pts.length; i++) {
            const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
            seg.push(l);
            tot += l;

          layer.appendChild(g);

            let i = 0;
            while (i < seg.length - 1 && d > seg[i]) {
              d -= seg[i];
              i++;
            }

              x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f,
              y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f;

            const t0 = performance.now();

            `DECODER${tag}`,
            `آدرس <code>${H(addr)}</code> (${m.a} بیت) از MAR به DECODER می‌رود. دیکدر یکی از ${2 ** m.a > 1e6 ? "۲^" + m.a : 2 ** m.a} خروجی را فعال می‌کند و ${k > 1 ? k + " خانهٔ پشت‌سرهم" : "خانهٔ"} <b>${selRange(addr, k).map((x) => H(x, Math.ceil(m.a / 4))).join(" ، ")}</b> انتخاب می‌شود.`,
          );
          const v = await stepRead(
            E_, m, addr, 1,
            `Read${tag}`,
            `سیگنال <b>Read</b> فعال می‌شود: <code>MBR ← (M(MAR))</code>. محتوای ${k} خانه (${w} بیت) = <code>${hv(rw(m, { mem: VM.mem }, addr))}</code> روی گذرگاه داده به MBR می‌آید.`,
          );
          const got = Math.min(bits, (j + 1) * w),
            part = full.slice(0, Math.ceil(got / 4)) + (got < bits ? "…" : "");
          await micro(
            E_, `MBR → IR${tag}`,
            `محتوای MBR در ثبات دستور <b>IR</b> قرار می‌گیرد و (مسیر ۱) به واحد کنترل CU می‌رسد. IR تا اینجا: <code>${part}</code>`,
            [1],
            async () => {
              light(["w1"], [1]);
              await E_.fly([[650, 296], [650, 352], [188, 352], [188, 316]], hv(v), PCOL[1], 800);
              VM.ir = part;
              T("irv", part);
              fl("ir");
            },
          );
        }
        VM.sel = [];
        paintMem();
        await micro(
          E_, "PC ← PC + طول دستور",
          `دستور ${L.I.sz} خانه (${bits} بیت) است؛ PC به دستور بعدی اشاره می‌کند: <code>${H(L.pc)} → ${H((L.pc + L.I.sz) % AM)}</code>. (در زمان اجرا PC از قبل به دستور بعدی اشاره دارد.)`,
          [],
          async () => {

      /* ----- decode ----- */
      const modeOf = (I) => {
        const s = I.s;
        if (/#/.test(s)) return "فوری (Immediate)";

        if (/\(/.test(s)) return "غیرمستقیم (Indirect)";
        if (Object.values(I.ft).includes("reg") && !Object.values(I.ft).includes("addr")) return "ثبات (Register)";

      async function decodePhase(E_, m, L) {
        const I = L.I,
          fv = L.fv,
          ob = I.f.f.filter((f) => f.t === "opcode").map((f) => fv[f.n].toString(2).padStart(f.b, "0")).join(""),
          opers = I.f.f.filter((f) => f.t !== "opcode").length;
        await micro(
          E_, "Decode — شناسایی دستور در CU",
          `CU بیت‌های opcode (<code>${ob}</code>) را در جدول دستورات پیدا می‌کند: <code>${E(I.s)}</code>. Opcode این اطلاعات را می‌دهد: <ul style="margin:4px 0 0;padding-inline-start:18px"><li>نوع عملیات: <code>${E(OPX(I.op || ""))}</code></li><li>قالب: ${E(I.f.n)} — ${opers} فیلد عملوند — طول ${I.bits} بیت (${I.sz} خانه)</li><li>حالت آدرس‌دهی: ${modeOf(I)}</li></ul>`,
          [],
          async () => {
            VM.dec = {
              mn: I.s,
              op: I.op || "",
              info: `${I.f.n} · ${I.bits} bit · opcode=${ob}`,
              f: I.f.f.map((f) => ({
                n: f.n,
                t: f.t,
                b: f.b,
                v: f.t === "reg" ? rnm(m, fv[f.n]) : H(fv[f.n], Math.ceil(f.b / 4)),
              })),
            };
            paintCtl();
            fl("ctl");
          },
        );
      }
      /* ----- execute (driven by the recorded trace) ----- */
      async function execPhase(E_, m, L, tr) {
        const I = L.I;
        let adrQ = [],

              E_, `ثبات ${E(regName(m, ev.i))} → ALU`,

              [],

              E_, `${E(ev.n)} → ALU`,

              [4],
              async () => {

                put(sl, ev.v);

          } else if (ev.k === "mr") {

              `دیکدر خانهٔ <b>${H(ev.a, Math.ceil(m.a / 4))}</b> را انتخاب می‌کند تا عملوند خوانده شود.`,

              E_, m, ev.a, 2, "Read · داده → MBR",

                [2],
                async () => {

                  await E_.fly(toAlu("mbr", sl), hv(ev.v), PCOL[2], 750);
                  put(sl, ev.v);
                },

            }

                it.src === "ir" ? [4] : it.src === "mbr" ? [2] : [],
                async () => {

                  await E_.fly(toAlu(it.src, sl, c), hv(it.v), "#12b5a0", 750);
                  put(sl, it.v);
                },
              );
            }
            await micro(
              E_, `ALU: آدرس مؤثر`,
              `CU فرمان <code>${sw(ev.o)}</code> را می‌دهد (مسیر ۳) و ALU آدرس مؤثر را حساب می‌کند: <code>${hv(ev.r)}</code>.`,
              [3],
              async () => {
                light(["w3"], [3]);
                await E_.fly([[324, 172], [380, 172], [380, 186], [436, 186]], sw(ev.o), PCOL[3], 600);
                T("aop", sw(ev.o));
                T("alRv", hv(ev.r));
                st.res = ev.r;
                fl("alR");
                fl("alf");
              },
            );
            adrQ.push({ src: "alu", v: ev.r });
          } else if (ev.k === "alu") {
            const two = ev.b !== undefined;
            await micro(
              E_, `CU → ALU : ${sw(ev.o)} (مسیر ۳)`,
              ev.cmp
                ? `CU فرمان مقایسه <code>${sw(ev.o)}</code> را به ALU می‌دهد. نتیجه (۱ = برقرار، ۰ = برقرار نیست) = <code>${ev.r}</code>. <b>مسیر ۳ — Command</b>`
                : `CU کد عمل را (از opcode دستور) به ALU می‌فرستد: <code>${hv(ev.a)} ${sw(ev.o)}${two ? " " + hv(ev.b) : ""}</code> = <code>${hv(ev.r)}</code>. <b>مسیر ۳ — Command</b>`,
              [3],
              async () => {
                if (st.A === null) put("A", ev.a);
                if (two && st.B === null) put("B", ev.b);
                light(["w3"], [3]);
                await E_.fly([[324, 172], [380, 172], [380, 186], [436, 186]], sw(ev.o), PCOL[3], 650);
                T("aop", sw(ev.o));

                fl("alf");
              },
            );

              [],
              async () => {
                fl("alR");
              },
            );
          } else if (ev.k === "mw") {
            const it = adrQ.length ? adrQ.pop() : { src: "ir", n: null, v: ev.a };
            adrQ = [];
            await toMAR(E_, m, it, ev.a);
            if (st.res === null) {
              T("alRv", hv(ev.v));
              st.res = ev.v;
            }
            await micro(
              E_, "نتیجه → MBR (مسیر ۲)",
              `نتیجه (<code>${hv(ev.v)}</code>) از ALU به MBR منتقل می‌شود تا در حافظه نوشته شود.${st.res === lastV && !st.A ? "" : ""}`,
              [2],
              async () => {
                light(["w2r"], [2]);
                await E_.fly(aluOut("mbr"), hv(ev.v), PCOL[2], 700);
                VM.mbr = ev.v;
                T("mbrv", H(ev.v, Math.ceil(m.w / 4)));
                fl("mbr");
              },
            );
            await stepDecoder(
              E_, m, ev.a, kk(m), true, 2, "DECODER · خانهٔ مقصد",
              `دیکدر خانهٔ مقصد <b>${H(ev.a, Math.ceil(m.a / 4))}</b> را انتخاب می‌کند.`,
            );

              E_, m, ev.a, ev.v, 2, "Write · MBR → حافظه",
              `سیگنال <b>Write</b> فعال می‌شود: <code>M(MAR) ← (MBR)</code>. مقدار <code>${hv(ev.v)}</code> در خانهٔ ${H(ev.a, Math.ceil(m.a / 4))} نوشته شد. <b>مسیر ۲ — Data access</b>`,
            );
            VM.sel = [];
            paintMem();
            clr();
          } else if (ev.k === "rw") {
            const c = regCell(m, ev.i);
            if (st.res === null) {
              T("alRv", hv(ev.v));
              st.res = ev.v;

              E_, `نتیجه → ثبات ${E(regName(m, ev.i))}`,

          } else if (ev.k === "sw") {

      /* ----- one instruction ----- */
      async function animStep() {
        if (!sim) return;
        if (sim.halted) {
          note("پایان برنامه", E(sim.msg || "برنامه متوقف شده است. با «بازنشانی» از اول شروع کنید."), []);
          return;
        }
        await guard(
          async (E_) => {
            const m = cur(),
              s = sim;
            if (!VM || VM.sim !== s) initVM();
            step1();
            const L = s.last,
              tr = s.tr || [];
            if (!L) {
              note("پایان برنامه", E(s.msg || ""), []);
              syncVM();
              paintAll();
              return;
            }
            await fetchPhase(E_, m, L);
            await decodePhase(E_, m, L);
            await execPhase(E_, m, L, tr);
            syncVM();
            paintAll();
            light([], []);
            document.querySelectorAll(".pl").forEach((e) => e.classList.remove("on"));
            note(
              `پایان دستور ${s.steps}`,
              `<code>${E(L.I.s)}</code> کامل شد. PC = <code>${H(s.sp.PC, Math.ceil(m.a / 4))}</code>${s.halted ? "<br><b>" + E(s.msg || "برنامه متوقف شد.") + "</b>" : ""}`,
              [],
            );
          },
          () => {
            syncVM();
            paintAll();
          },
        );
      }
      async function animAuto() {
        if (AN.auto) {
          AN.auto = false;
          return;
        }

        const g = AN.gen;
        T("bauto", "⏹ توقف");
        while (AN.auto && g === AN.gen && sim && !sim.halted) {
          await animStep();
          while (AN.busy && g === AN.gen) await new Promise((r) => setTimeout(r, 40));
        }
        AN.auto = false;
        T("bauto", "⏵ اجرای پیوسته");
      }
      function animFast() {
        AN.gen++;
        AN.busy = false;
        AN.auto = false;

        while (!sim.halted && n++ < 100000) step1();

        mountCpu();

      }

            v = prompt(`مقدار جدید خانهٔ ${i} (عدد دهدهی ۰ تا ۶۵۵۳۵):`, LB.mem[i]);
          if (v !== null && Number.isFinite(parseInt(v, 10))) {
            LB.mem[i] = ((parseInt(v, 10) % 65536) + 65536) % 65536;
            LB.chg.add(i);
            labPaint();
          }
        }
      }
      document.addEventListener("input", (e) => {
        if (e.target.id === "spd") AN.speed = +e.target.value || 1;
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "lbits") {
          gfxStop();
          labInit(+e.target.value);
          render();
        }
      });
      /* ---------- events ---------- */
      const setp = (o, p, v) => {
        const k = p.split(".");
        for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
        o[k.at(-1)] = v;
      };
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "sel") {
          S.cur = t.value;
          sim = null;
          save();
          render();
          return;
        }
        if (t.id === "fi") {
          const f = t.files[0];
          if (f)
            f.text().then((x) => {
              try {
                const j = JSON.parse(x);
                (Array.isArray(j) ? j : [j]).forEach((n) => {
                  n.id = uid();
                  S.list.push(n);
                  S.cur = n.id;
                });
                sim = null;
                save();
                render();
              } catch (e) {
                alert("Invalid file");
              }
            });
          t.value = "";
          return;
        }
        if (!t.dataset.p) return;
        let v = t.type === "number" ? Math.max(0, +t.value || 0) : t.value;
        setp(cur(), t.dataset.p, v);
        sim = null;
        save();
        render();
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "code") {
          cur().code = e.target.value;
          sim = null;
          save();
          clearTimeout(window._d);
          window._d = setTimeout(upd, 250);
        }
      });
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act],[data-tab]");
        if (!b) return;
        if (b.dataset.tab) {
          tab = b.dataset.tab;
          if (tab === "sim") resetSim();
          render();
          return;
        }
        {
          const [ga, gp = ""] = b.dataset.act.split(":");
          if (
            ["smode", "lab", "labset"].includes(ga) ||
            /^an(step|auto|pause|micro|next|fast|reset|demo)$/.test(ga)
          ) {
            gfxAct(ga, gp);
            return;
          }
        }
        const [a, p = ""] = b.dataset.act.split(":"),
          m = cur(),
          [x, y] = p.split(".").map(Number);
        if (a === "newm") {
          const n = blank();
          S.list.push(n);
          S.cur = n.id;
          tab = "def";
        } else if (a === "dup") {
          const n = JSON.parse(JSON.stringify(m));
          n.id = uid();
          n.name += " (کپی)";
          S.list.push(n);
          S.cur = n.id;
        } else if (a === "del") {
          if (S.list.length > 1) {
            S.list = S.list.filter((q) => q.id !== m.id);
            S.cur = S.list[0].id;
          }
        } else if (a === "addf")
          m.fm.push(
            F(
              "Format " + (m.fm.length + 1),
              [
                ["Opcode", 8, "opcode"],
                ["addr", 16, "addr"],
              ],
              [],
            ),
          );
        else if (a === "delf") m.fm.splice(x, 1);
        else if (a === "addfld")
          m.fm[x].f.push({ n: "f" + m.fm[x].f.length, b: 8, t: "imm" });
        else if (a === "delfld") m.fm[x].f.splice(y, 1);
        else if (a === "addi")
          m.fm[x].i.push({ o: "0", s: "op", op: "PC <- PC" });
        else if (a === "deli") m.fm[x].i.splice(y, 1);
        else if (a === "step") step1();
        else if (a === "run") {
          let n = 0;
          while (!sim.halted && n++ < 100000) step1();
          if (!sim.halted) {
            sim.halted = true;
            sim.msg = "خطا: بیش از ۱۰۰٬۰۰۰ گام — احتمالاً حلقهٔ بی‌نهایت";
          }
        } else if (a === "reset") resetSim();
        else if (a === "lang") S.lang = S.lang === "en" ? "fa" : "en";
        else if (a === "exp") {
          const j = JSON.parse(JSON.stringify(m));
          delete j.id;
          dl(
            m.name.replace(/\W+/g, "_") + ".machine.json",
            new Blob([JSON.stringify(j, null, 1)], {
              type: "application/json",
            }),
          );
          return;
        } else if (a === "imp") {
          $("#fi").click();
          return;
        } else if (a === "sl") {
          showSlides();
          return;
        } else if (a === "theme") {
          const d = document.documentElement;
          d.dataset.theme =
            (d.dataset.theme ||
              (matchMedia("(prefers-color-scheme:dark)").matches
                ? "dark"
                : "light")) === "dark"
              ? "light"
              : "dark";
          return;
        }
        if (!["step", "run", "reset"].includes(a)) sim = null;
        save();
        render();
      });
      document
        .querySelectorAll(
          ".logo,.tab,[data-act=newm],[data-act=dup],[data-act=del]",
        )
        .forEach((e) => (e.dataset.fa = e.textContent));
      render();
      fetch("/api/state")
        .then((r) => (r.ok ? r.json() : null))
        .then((j) => {
          if (!j) return;
          DB = true;
          $("#db").hidden = false;
          if (j.list && j.list.length) {
            const lg = S.lang;
            S = j;
            S.lang = lg || "fa";
          }
          save();
          render();
        })
        .catch(() => {});
    </script>
  </body>
</html>
